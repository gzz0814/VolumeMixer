name: Build deb

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang lld llvm binutils \
            git curl wget perl python3 zip unzip fakeroot \
            xz-utils liblzma-dev libxml2-dev libz-dev libssl-dev gnupg

      - name: Install Theos (clone, non-interactive)
        run: |
          git clone --depth=1 https://github.com/theos/theos.git "${RUNNER_TEMP}/theos"
          echo "THEOS=${RUNNER_TEMP}/theos" >> "$GITHUB_ENV"
          echo "${RUNNER_TEMP}/theos/bin" >> "$GITHUB_PATH"

      - name: Build package
        run: |
          make clean
          make package FINAL=1

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: VolumeMixer-deb
          path: packages/*.deb
          if-no-files-found: error
