name: Build deb

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos (recursive, with Xcode toolchain/SDK)
        run: |
          git clone --recursive https://github.com/theos/theos.git "${RUNNER_TEMP}/theos"
          export THEOS="${RUNNER_TEMP}/theos"
          "${THEOS}/bin/post-update" || true
          echo "THEOS=${RUNNER_TEMP}/theos" >> "$GITHUB_ENV"
          echo "${RUNNER_TEMP}/theos/bin" >> "$GITHUB_PATH"

      - name: Show toolchain info
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          ls "${THEOS}/bin"

      - name: Build package
        run: |
          make clean
          make package FINAL=1

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: VolumeMixer-deb
          path: packages/*.deb
          if-no-files-found: error
