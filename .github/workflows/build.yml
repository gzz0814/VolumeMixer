name: Build deb

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos (recursive, with Xcode toolchain/SDK)
        run: |
          git clone --recursive https://github.com/theos/theos.git "${RUNNER_TEMP}/theos"
          export THEOS="${RUNNER_TEMP}/theos"
          "${THEOS}/bin/post-update" || true
          echo "THEOS=${RUNNER_TEMP}/theos" >> "$GITHUB_ENV"
          echo "${RUNNER_TEMP}/theos/bin" >> "$GITHUB_PATH"

      - name: Show toolchain info
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          ls "${THEOS}/bin"

      - name: Install ldid (codesign tool)
        run: |
          brew install ldid-procursus || brew install ldid || brew install theos/theos/ldid
          which ldid

      - name: Build package
        run: |
          # Auto-increment the package version on every build. The first three
          # dotted components come from control; the fourth is GITHUB_RUN_NUMBER,
          # which only ever increases, so each .deb has a strictly greater version
          # than the previous build and package managers can never keep or roll
          # back to a stale build.
          BASE="$(awk -F': ' '/^Version:/{print $2}' control)"
          BASE_MAIN="$(echo "$BASE" | cut -d. -f1-3)"
          NEW_VERSION="${BASE_MAIN}.${GITHUB_RUN_NUMBER}"
          sed -i.bak "s/^Version:.*/Version: ${NEW_VERSION}/" control
          rm -f control.bak
          echo "PKG_VERSION=${NEW_VERSION}" >> "$GITHUB_ENV"
          echo "Version: ${BASE} -> ${NEW_VERSION}"
          make clean
          make package FINAL=1

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: VolumeMixer-deb
          path: packages/*.deb
          if-no-files-found: error

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="$(git rev-parse HEAD)"
          SHORT="${SHA:0:7}"
          NOTES="Automated build v${PKG_VERSION} from commit $SHORT."
          # Rolling prerelease that always points at the newest successful build.
          if ! gh release view latest-build >/dev/null 2>&1; then
            gh release create latest-build \
              --target "$SHA" \
              --title "VolumeMixer latest build (v${PKG_VERSION})" \
              --prerelease \
              --notes "$NOTES"
          else
            gh release edit latest-build --target "$SHA" \
              --title "VolumeMixer latest build (v${PKG_VERSION})" \
              --notes "$NOTES"
          fi
          gh release upload latest-build packages/*.deb --clobber
